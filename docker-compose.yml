services:

  frontend:
    build:
      context: ./frontend
    container_name: marketpulse-frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: marketpulse-backend
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
    environment:
      PYTHONUNBUFFERED: "1"
      OPTIONS_CHAIN_URL: ${OPTIONS_CHAIN_URL:-https://www.nseindia.com/api/option-chain-indices}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  collector:
    build:
      context: ./backend
    container_name: marketpulse-collector
    command: ["python", "-m", "app.collector"]
    volumes:
      - ./backend:/app
    environment:
      PYTHONUNBUFFERED: "1"
      OPTIONS_CHAIN_URL: ${OPTIONS_CHAIN_URL:-https://www.nseindia.com/api/option-chain-indices}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: marketpulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: marketpulse-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  frontend_node_modules: